<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenos MyWhoosh</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
        th { background-color: #eee; }
        input { width: 80%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .config { margin-bottom: 20px; padding: 15px; background: #e9ecef; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>🚀 Traductor de Series</h1>

    <!-- Configuración de FTP -->
    <div class="config">
        <label for="ftp">Mi FTP Actual (W): </label>
        <input type="number" id="ftp" inputmode="numeric" value="256">
        <p><small>Se guarda automáticamente para la próxima vez.</small></p>
    </div>

    <hr>

    <!-- Tabla de Entrenamiento -->
    <table>
        <thead>
            <tr>
                <th>Bloque</th>
                <th>Objetivo</th>
                <th>Real (W) ✍️</th>
                <th>Real (RPM) ✍️</th>
            </tr>
        </thead>
        <tbody id="cuerpo-tabla">
            <!-- Aquí volcaremos los entrenos que yo te pase -->
            <tr>
                <td colspan="4">Esperando instrucciones de Gemini...</td>
            </tr>
        </tbody>
    </table>

    <script>
        const ftpInput = document.getElementById('ftp');

        // 💾 Cargar FTP guardado al abrir la app
        window.onload = () => {
            const guardado = localStorage.getItem('mi_ftp');
            if (guardado) ftpInput.value = guardado;
        };

        // 🔄 Guardar FTP cada vez que lo cambies
        ftpInput.addEventListener('input', () => {
            localStorage.setItem('mi_ftp', ftpInput.value);
        });

        // Función que usaré yo para enviarte filas
        function agregarFila(nombre, objetivo) {
            const tabla = document.getElementById('cuerpo-tabla');
            if (tabla.rows[0].cells.length === 1) tabla.innerHTML = ""; // Limpiar mensaje inicial
            
            const nuevaFila = `<tr>
                <td>${nombre}</td>
                <td>${objetivo}</td>
                <td><input type="number" inputmode="decimal" placeholder="W"></td>
                <td><input type="number" inputmode="decimal" placeholder="RPM"></td>
            </tr>`;
            tabla.innerHTML += nuevaFila;
        }
    </script>
</body>
</html>
